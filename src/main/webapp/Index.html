<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: url('weather.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .weather-container {
      background-size: cover;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    .weather-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      border-radius: 16px;
      background-color: rgba(255, 255, 255, 0.85);
      z-index: -1;
    }

    .form-control {
      border-radius: 10px;
    }

    .image-button {
      background: none;
      border: none;
      padding: 0;
      margin-top: 10px;
    }

    .image-button img {
      width: 40px;
      height: 40px;
    }

    h2 {
      color: #333;
    }
  </style>
</head>
<body>
<form action="WeatherServlet" method="post">
  <div class="weather-container">
    <h2 class="mb-4">Weather App</h2>
      <div class="mb-3">
        <input
          type="text"
          name="city"
          class="form-control"
          placeholder="Enter city name"
          required
        />
      </div>
      <button type="submit" class="image-button">
        <img src="https://img.icons8.com/ios-filled/50/search--v1.png" alt="Search" />
      </button>
  
  </div>

  </form>
</body>
</html>
